conf-file=/run/debian-vendoos/dnsmasq-vlans.conf
# Customer DNS is advertised directly as 8.8.8.8 and 1.1.1.1. Running
# dnsmasq in DHCP-only wildcard mode avoids one DNS socket per VLAN and scales
# to thousands of configured customer networks.
port=0
except-interface=lo
dhcp-authoritative
dhcp-option=114,__PORTAL_URL__api/captive
domain-needed
bogus-priv
no-resolv
server=8.8.8.8
server=1.1.1.1
address=/captive.apple.com/__HOTSPOT_ADDRESS__
address=/connectivitycheck.gstatic.com/__HOTSPOT_ADDRESS__
address=/connectivitycheck.android.com/__HOTSPOT_ADDRESS__
address=/www.msftconnecttest.com/__HOTSPOT_ADDRESS__
address=/dns.msftncsi.com/__HOTSPOT_ADDRESS__
log-dhcp
